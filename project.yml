name: APIMonitoring

options:
  bundleIdPrefix: com.kumoyama
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""

targets:
  APIMonitoring:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: API监控
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kumoyama.apimonitoring

  APIMonitoringTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: App/Tests
    dependencies:
      - target: APIMonitoring
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kumoyama.apimonitoring.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/APIMonitoring.app/APIMonitoring"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  APIMonitoring:
    build:
      targets:
        APIMonitoring: all
        APIMonitoringTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - APIMonitoringTests
